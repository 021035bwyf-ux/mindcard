<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>마음기록 - 마음카드</title>
<meta name="description" content="오늘 내 마음을 하루 한 번, 가볍게 기록해봐요. 기록은 이 기기에만 저장돼요.">
<link rel="stylesheet" href="css/hub.css?v=13">
</head>
<body>
<div class="bg-blob-layer"><span class="bg-blob b1"></span><span class="bg-blob b2"></span><span class="bg-blob b3"></span></div>
<div class="wrap test-page">
  <a class="back-link" href="index.html">← 마음카드 홈</a>

  <header class="hub-header" style="padding-top:0;">
    <div class="hub-logo">📝 마음기록</div>
    <h1 class="hub-title" id="recordTitle" style="font-size:clamp(22px,5vw,30px);">오늘 내 마음은<br>어땠나요?</h1>
    <p class="hub-sub" id="recordSub">하루 5초, 감정 하나만 골라도 충분해요.</p>
  </header>

  <div id="app"></div>

  <p class="section-title">📅 최근 7일</p>
  <div class="day-strip" id="dayStrip"></div>
  <a class="back-link" href="my.html" style="display:block;text-align:center;">📊 전체 기록은 마이에서 보기 →</a>

  <p class="disclaimer">이 기록은 이 기기(브라우저)에만 저장되고, 어디로도 전송되지 않아요.<br>다른 기기나 브라우저에서는 보이지 않아요.</p>
</div>

<script src="js/hub-core.js?v=8"></script>
<script>
Hub.log('visit', null, 'record_page');

const app = document.getElementById('app');
let editing = false;
let picked = null;

function render() {
  const today = Hub.Records.getToday();

  if (today && !editing) {
    document.getElementById('recordTitle').innerHTML = '오늘 기록, 완료했어요';
    document.getElementById('recordSub').textContent = '내일 또 가볍게 남겨주세요. 수정하고 싶다면 아래에서 바꿀 수 있어요.';
    const mi = Hub.Records.moodInfo(today.mood);
    app.innerHTML = `
      <div class="today-card">
        <div class="today-emoji">${mi.emoji}</div>
        <p class="today-label">오늘은 "${mi.label}"</p>
        ${today.note ? `<p class="today-note">${escapeHtml(today.note)}</p>` : ''}
      </div>
      <button class="btn-next" id="btnEdit" style="background:#fff;color:var(--text-secondary);border:1.5px solid var(--border);box-shadow:none;">오늘 기록 수정하기</button>
    `;
    document.getElementById('btnEdit').addEventListener('click', () => {
      editing = true;
      picked = today.mood;
      render();
    });
    return;
  }

  document.getElementById('recordTitle').innerHTML = '오늘 내 마음은<br>어땠나요?';
  document.getElementById('recordSub').textContent = '하루 5초, 감정 하나만 골라도 충분해요.';

  app.innerHTML = `
    <div class="mood-grid" id="moodGrid">
      ${Hub.MOODS.map(m => `
        <button type="button" class="mood-btn${picked === m.key ? ' selected' : ''}" data-mood="${m.key}">
          <span class="mood-emoji">${m.emoji}</span><span>${m.label}</span>
        </button>
      `).join('')}
    </div>
    <textarea class="note-input" id="noteInput" maxlength="140" placeholder="오늘 있었던 일을 한 줄로 적어도 좋아요 (선택)"></textarea>
    <button class="btn-next" id="btnSave" ${picked ? '' : 'disabled'}>기록하기</button>
  `;

  const existing = Hub.Records.getToday();
  if (existing && editing) document.getElementById('noteInput').value = existing.note || '';

  document.querySelectorAll('.mood-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      picked = btn.getAttribute('data-mood');
      render();
      const ni = document.getElementById('noteInput');
      if (ni && existing) ni.value = existing.note || '';
    });
  });

  const saveBtn = document.getElementById('btnSave');
  if (saveBtn) {
    saveBtn.disabled = !picked;
    saveBtn.addEventListener('click', () => {
      if (!picked) return;
      const note = document.getElementById('noteInput').value;
      Hub.Records.save(picked, note);
      Hub.log('record_save', null, picked);
      editing = false;
      picked = null;
      render();
      renderStrip();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderStrip() {
  const strip = document.getElementById('dayStrip');
  const all = Hub.Records.getAll();
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const ds = Hub.todayStr(d);
    const rec = all.find(r => r.date === ds);
    days.push({ ds, d, rec, isToday: i === 0 });
  }
  strip.innerHTML = days.map(({ d, rec, isToday }) => `
    <div class="day-chip${rec ? ' has-record' : ''}${isToday ? ' is-today' : ''}">
      <div class="day-dot">${rec ? Hub.Records.moodInfo(rec.mood).emoji : ''}</div>
      <span class="day-label">${d.getMonth() + 1}/${d.getDate()}</span>
    </div>
  `).join('');
}

render();
renderStrip();
</script>
</body>
</html>
