<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>마음연결 신청 - 마음카드</title>
<meta name="description" content="마음연결 패스, 코디네이터 지원, 보호자 자조모임을 신청할 수 있어요.">
<link rel="stylesheet" href="css/hub.css?v=13">
</head>
<body>
<div class="bg-blob-layer"><span class="bg-blob b1"></span><span class="bg-blob b2"></span><span class="bg-blob b3"></span></div>
<div class="wrap test-page">
  <a class="back-link" href="location.html">← 지역연결로 돌아가기</a>

  <header class="hub-header" style="padding-top:0;">
    <div class="hub-logo">🤝 마음연결 신청</div>
    <h1 class="hub-title" style="font-size:clamp(22px,5vw,30px);">연결, 여기서<br>시작해볼까요?</h1>
    <p class="hub-sub">몇 가지만 남겨주시면, 담당자가 확인 후 편하게 연락드려요.</p>
  </header>

  <div id="app"></div>

  <p class="disclaimer">전화·카카오톡으로 먼저 이야기하고 싶다면 <a href="location.html" style="color:var(--primary-dark);font-weight:700;">지역연결 페이지</a>에서 바로 연결할 수 있어요.</p>
</div>

<script src="js/hub-core.js?v=8"></script>
<script>
Hub.log('visit', null, 'apply_page');

const app = document.getElementById('app');
const state = {
  category: 'pass',
  applicantType: 'self',
  name: '',
  birthYear: '',
  phone: '',
  guardianName: '',
  guardianPhone: '',
  location: '',
  message: '',
  consent: false
};
const CATEGORY_LABELS = { pass: '마음연결 패스', coordinator: '코디네이터 지원', guardian_group: '보호자 자조모임' };
let submitting = false;
let errorMsg = '';
let submitted = false;

const thisYear = new Date().getFullYear();
const yearOptions = [];
for (let y = thisYear; y >= thisYear - 60; y--) yearOptions.push(y);

function isMinor() {
  if (!state.birthYear) return false;
  return (thisYear - Number(state.birthYear)) < 14;
}
function needsGuardian() {
  return state.applicantType === 'guardian' || isMinor();
}

function render() {
  if (submitted) {
    app.innerHTML = `
      <div class="success-card">
        <div class="success-emoji">🌱</div>
        <p class="success-title">신청이 접수됐어요</p>
        <p class="success-desc">남겨주신 연락처로 담당자가 2~3일 안에 연락드릴게요.<br>급하게 이야기하고 싶다면 아래 연락처도 함께 이용해주세요.</p>
      </div>
      <div id="cta-slot" style="margin-top:20px;"></div>
      <a class="back-link" href="index.html" style="display:block;text-align:center;margin-top:18px;">🌱 마음카드 홈으로</a>
    `;
    Hub.renderCTA(document.getElementById('cta-slot'), 'apply_page', false, {
      leadText: '연락을 기다리는 동안 궁금한 게 있으면 언제든 아래로 먼저 연락해도 괜찮아요.',
      note: `${Hub.CENTER.name} · 만 9~24세 무료 상담`
    });
    return;
  }

  app.innerHTML = `
    <div class="form-field">
      <label class="form-label">신청 종류 <span class="req">*</span></label>
      <div class="segmented" id="categorySeg">
        ${Object.entries(CATEGORY_LABELS).map(([k, v]) => `<button type="button" data-v="${k}" class="${state.category === k ? 'selected' : ''}">${v}</button>`).join('')}
      </div>
    </div>

    <div class="form-field">
      <label class="form-label">신청자 구분 <span class="req">*</span></label>
      <div class="segmented" id="applicantSeg">
        <button type="button" data-v="self" class="${state.applicantType === 'self' ? 'selected' : ''}">본인이 신청</button>
        <button type="button" data-v="guardian" class="${state.applicantType === 'guardian' ? 'selected' : ''}">보호자가 대신 신청</button>
      </div>
    </div>

    <div class="form-field">
      <label class="form-label">${state.applicantType === 'guardian' ? '자녀(참여자) 이름' : '이름'} <span class="req">*</span></label>
      <input class="form-input" id="fName" type="text" maxlength="30" value="${escapeAttr(state.name)}" placeholder="이름을 입력해주세요">
    </div>

    <div class="form-field">
      <label class="form-label">${state.applicantType === 'guardian' ? '자녀(참여자) 출생연도' : '출생연도'} <span class="req">*</span></label>
      <select class="form-select" id="fBirthYear">
        <option value="">선택해주세요</option>
        ${yearOptions.map(y => `<option value="${y}" ${String(state.birthYear) === String(y) ? 'selected' : ''}>${y}년</option>`).join('')}
      </select>
      <p class="form-hint">만 14세 미만이면 보호자 정보를 함께 받아요.</p>
    </div>

    <div class="form-field">
      <label class="form-label">${state.applicantType === 'guardian' ? '보호자(신청자) 연락처' : '연락처'} <span class="req">*</span></label>
      <input class="form-input" id="fPhone" type="tel" maxlength="20" value="${escapeAttr(state.phone)}" placeholder="010-0000-0000">
    </div>

    ${needsGuardian() && state.applicantType === 'self' ? `
      <div class="guardian-box">
        <p class="form-hint" style="margin:0 0 10px;">만 14세 미만은 보호자 정보가 함께 필요해요.</p>
        <div class="form-field">
          <label class="form-label">보호자 이름 <span class="req">*</span></label>
          <input class="form-input" id="fGuardianName" type="text" maxlength="30" value="${escapeAttr(state.guardianName)}" placeholder="보호자 이름">
        </div>
        <div class="form-field">
          <label class="form-label">보호자 연락처 <span class="req">*</span></label>
          <input class="form-input" id="fGuardianPhone" type="tel" maxlength="20" value="${escapeAttr(state.guardianPhone)}" placeholder="010-0000-0000">
        </div>
      </div>
    ` : ''}

    <div class="form-field" style="margin-top:16px;">
      <label class="form-label">희망 센터 <span class="req">*</span></label>
      <select class="form-select" id="fLocation">
        <option value="">선택해주세요</option>
        ${Hub.LOCATIONS.map(l => `<option value="${l.name}" ${state.location === l.name ? 'selected' : ''}>${l.name}</option>`).join('')}
        <option value="상관없음" ${state.location === '상관없음' ? 'selected' : ''}>어디든 상관없어요</option>
      </select>
    </div>

    <div class="form-field">
      <label class="form-label">하고 싶은 말 (선택)</label>
      <textarea class="form-textarea" id="fMessage" maxlength="300" placeholder="요즘 어떤 게 가장 힘든지, 어떤 도움이 필요한지 편하게 적어주세요">${escapeHtml(state.message)}</textarea>
    </div>

    <div class="consent-box">
      <label class="consent-check">
        <input type="checkbox" id="fConsent" ${state.consent ? 'checked' : ''}>
        <span>개인정보 수집·이용에 동의합니다 <span class="req">*</span></span>
      </label>
      <details class="consent-details">
        <summary>자세히 보기</summary>
        <p style="margin:8px 0 0;">
          수집 항목: 이름, 출생연도, 연락처(필요 시 보호자 이름·연락처), 희망 센터, 신청 내용<br>
          수집 목적: 마음연결 신청 접수 및 담당자 연결<br>
          보유 기간: 신청 처리 완료 후 별도 기준에 따라 파기 (사업 확정 후 운영 기준 명시 예정)<br>
          동의를 거부할 수 있으며, 거부 시 신청 접수가 어려울 수 있어요.
        </p>
      </details>
    </div>

    ${errorMsg ? `<p class="form-error">${escapeHtml(errorMsg)}</p>` : ''}

    <button class="btn-next" id="btnSubmit" ${submitting ? 'disabled' : ''}>${submitting ? '접수하는 중...' : '신청하기'}</button>
  `;

  document.querySelectorAll('#categorySeg button').forEach(b => b.addEventListener('click', () => { state.category = b.getAttribute('data-v'); render(); }));
  document.querySelectorAll('#applicantSeg button').forEach(b => b.addEventListener('click', () => { state.applicantType = b.getAttribute('data-v'); render(); }));
  document.getElementById('fName').addEventListener('input', e => state.name = e.target.value);
  document.getElementById('fBirthYear').addEventListener('change', e => { state.birthYear = e.target.value; render(); });
  document.getElementById('fPhone').addEventListener('input', e => state.phone = e.target.value);
  document.getElementById('fLocation').addEventListener('change', e => state.location = e.target.value);
  document.getElementById('fMessage').addEventListener('input', e => state.message = e.target.value);
  document.getElementById('fConsent').addEventListener('change', e => state.consent = e.target.checked);
  const gn = document.getElementById('fGuardianName');
  const gp = document.getElementById('fGuardianPhone');
  if (gn) gn.addEventListener('input', e => state.guardianName = e.target.value);
  if (gp) gp.addEventListener('input', e => state.guardianPhone = e.target.value);

  document.getElementById('btnSubmit').addEventListener('click', onSubmit);
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

async function onSubmit() {
  errorMsg = '';
  if (!state.name.trim()) errorMsg = '이름을 입력해주세요.';
  else if (!state.birthYear) errorMsg = '출생연도를 선택해주세요.';
  else if (!state.phone.trim()) errorMsg = '연락처를 입력해주세요.';
  else if (needsGuardian() && (!state.guardianName.trim() || !state.guardianPhone.trim()) && state.applicantType === 'self') errorMsg = '보호자 이름과 연락처를 입력해주세요.';
  else if (!state.location) errorMsg = '희망 센터를 선택해주세요.';
  else if (!state.consent) errorMsg = '개인정보 수집·이용에 동의해주세요.';

  if (errorMsg) { render(); window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); return; }

  submitting = true;
  render();
  try {
    await Hub.submitApplication({
      category: state.category,
      applicant_type: state.applicantType,
      name: state.name.trim(),
      birth_year: Number(state.birthYear),
      phone: state.phone.trim(),
      is_minor: isMinor(),
      guardian_name: needsGuardian() ? state.guardianName.trim() : null,
      guardian_phone: needsGuardian() ? state.guardianPhone.trim() : null,
      preferred_location: state.location,
      message: state.message.trim() || null,
      consent: state.consent
    });
    Hub.log('application_submit', null, state.category);
    submitted = true;
    submitting = false;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    submitting = false;
    errorMsg = (e && e.message) || '접수 중 문제가 생겼어요. 잠시 후 다시 시도해주세요.';
    render();
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }
}

render();
</script>
</body>
</html>
