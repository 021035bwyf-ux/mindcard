<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>마이 - 마음카드</title>
<meta name="description" content="내가 남긴 마음 기록을 모아서 볼 수 있어요. 기록은 이 기기에만 저장돼요.">
<link rel="stylesheet" href="css/hub.css?v=13">
</head>
<body>
<div class="bg-blob-layer"><span class="bg-blob b1"></span><span class="bg-blob b2"></span><span class="bg-blob b3"></span></div>
<div class="wrap test-page">
  <a class="back-link" href="index.html">← 마음카드 홈</a>

  <header class="hub-header" style="padding-top:0;">
    <div class="hub-logo">🌤️ 마이</div>
    <h1 class="hub-title" id="myTitle" style="font-size:clamp(22px,5vw,30px);">나의 마음 기록</h1>
    <p class="hub-sub" id="mySub"></p>
  </header>

  <div class="stat-chip-row" id="statRow"></div>
  <div id="nudgeSlot"></div>

  <a class="btn-next" href="record.html" id="btnTodayRecord" style="text-decoration:none;text-align:center;">오늘 기록하기</a>

  <p class="section-title">🗂️ 기록 모아보기</p>
  <div id="recordList"></div>

  <p class="disclaimer">모든 기록은 이 기기(브라우저)에만 저장돼요. 센터나 다른 사람에게 자동으로 전달되지 않아요.</p>
</div>

<script src="js/hub-core.js?v=10"></script>
<script>
Hub.log('visit', null, 'my_page');

const all = Hub.Records.getAll();
const state = Hub.Records.classify();

const TITLES = {
  none:      { title: '아직 기록이 없어요', sub: '오늘 마음 하나를 가볍게 남겨볼까요?' },
  light:     { title: '하나씩 쌓여가고 있어요', sub: '쌓인 기록은 나중에 여기서 다시 볼 수 있어요.' },
  candidate: { title: '최근 꾸준히 기록하고 계시네요', sub: '이 흐름, 계속 가져가 보세요.' },
  sustained: { title: '몇 주째 꾸준히 와주고 계시네요', sub: '그동안 정말 잘하고 계세요.' }
};
document.getElementById('myTitle').textContent = TITLES[state].title;
document.getElementById('mySub').textContent = TITLES[state].sub;

if (Hub.Records.getToday()) {
  const btn = document.getElementById('btnTodayRecord');
  btn.textContent = '오늘 기록 다시 보기';
}

// 연속 기록일 계산 (오늘 기록이 없으면 어제까지 기준)
function calcStreak(records) {
  let count = 0;
  let cursor = new Date();
  if (!records.some(r => r.date === Hub.todayStr(cursor))) cursor.setDate(cursor.getDate() - 1);
  while (records.some(r => r.date === Hub.todayStr(cursor))) {
    count++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return count;
}

document.getElementById('statRow').innerHTML = `
  <div class="stat-chip"><span class="stat-num">${all.length}</span><span class="stat-label">총 기록일</span></div>
  <div class="stat-chip"><span class="stat-num">${calcStreak(all)}</span><span class="stat-label">연속 기록일</span></div>
`;

// 최근 7개 기록 중 힘든 기분(지쳐요/힘들어요)이 많으면, 부담 없는 톤으로 지역연결을 살짝 안내
const recentMoods = all.slice(0, 7).map(r => r.mood);
const hardCount = recentMoods.filter(m => m === 'tired' || m === 'hard').length;
if (all.length >= 3 && hardCount >= 4) {
  document.getElementById('nudgeSlot').innerHTML = `
    <div class="nudge-box">
      <p>요즘 기록을 보니 마음이 계속 무거우셨던 것 같아요. 혼자 끌어안지 않아도 괜찮아요 — 가까운 곳과 연결해볼까요?</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a class="cta-btn cta-btn-primary" href="apply.html" style="flex:1;">🤝 마음연결 신청하기</a>
        <a class="cta-btn" href="location.html" style="flex:1;">📍 거점 먼저 보기</a>
      </div>
    </div>
  `;
}

const list = document.getElementById('recordList');
if (!all.length) {
  list.innerHTML = `<p style="text-align:center;color:var(--text-muted);font-size:13.5px;padding:20px 0;">아직 기록이 없어요. 위 버튼으로 첫 기록을 남겨보세요.</p>`;
} else {
  list.innerHTML = all.slice(0, 30).map(r => {
    const mi = Hub.Records.moodInfo(r.mood);
    const d = new Date(r.date + 'T00:00:00');
    const dateLabel = `${d.getMonth() + 1}월 ${d.getDate()}일`;
    return `
      <div class="record-row">
        <span class="record-emoji">${mi.emoji}</span>
        <div>
          <p class="record-date">${dateLabel}</p>
          <p class="record-mood">${mi.label}</p>
          ${r.note ? `<p class="record-note">${escapeHtml(r.note)}</p>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
</script>
</body>
</html>
