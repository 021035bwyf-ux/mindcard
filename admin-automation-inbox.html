<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마음카드 - 승인 대기함</title>
<link rel="stylesheet" href="css/hub.css?v=13">
<style>
  .wrap { max-width: 1000px; }
  #login-box { max-width: 340px; margin: 60px auto; text-align: center; }
  #login-box input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: 1px solid var(--border); font-size: 15px; box-sizing: border-box; }
  #login-box button { width: 100%; margin-top: 12px; padding: 12px; border: none; border-radius: 10px; background: var(--primary); color: #fff; font-weight: 700; cursor: pointer; }
  #login-box p.hint { font-size: 12px; color: var(--text-muted); margin-top: 14px; line-height: 1.6; }
  .top-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .nav-row { display: flex; gap: 8px; margin: 14px 0 20px; }
  .nav-row a { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: #fff; font-size: 12.5px; font-weight: 700; color: var(--text-secondary); text-decoration: none; }
  .nav-row a.current { background: var(--primary); color: #fff; border-color: var(--primary); }
  .section-title { font-size: 15px; font-weight: 800; margin: 24px 0 12px; }
  .task-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; margin-bottom: 10px; }
  .task-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .task-area { font-size: 11px; font-weight: 800; color: var(--primary-dark); background: var(--primary-light); padding: 3px 10px; border-radius: 999px; display: inline-block; margin-bottom: 6px; }
  .task-title { font-size: 15px; font-weight: 800; margin: 0; }
  .task-content { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin: 8px 0; white-space: pre-wrap; }
  .task-meta { font-size: 11.5px; color: var(--text-muted); }
  .task-link { font-size: 12px; font-weight: 700; color: var(--primary-dark); }
  .task-actions { display: flex; gap: 6px; margin-top: 12px; }
  .task-actions button { flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--border); background: #fff; font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .btn-approve { color: #1D7F88; border-color: #1D7F88 !important; }
  .btn-reject { color: #D64545; border-color: #D64545 !important; }
  .empty-note { text-align: center; color: var(--text-muted); font-size: 13.5px; padding: 24px 0; }
  .new-task-box { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; margin-bottom: 20px; }
  .new-task-box summary { font-size: 13.5px; font-weight: 800; cursor: pointer; }
  .new-task-fields { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .new-task-fields label { font-size: 11.5px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 4px; }
  .new-task-fields select, .new-task-fields input, .new-task-fields textarea {
    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit; font-size: 13px; box-sizing: border-box;
  }
  .new-task-fields textarea { min-height: 70px; resize: vertical; }
  .new-task-row { display: flex; gap: 10px; }
  .new-task-row > div { flex: 1; }
  #btnCreateTask { padding: 10px; border: none; border-radius: 10px; background: var(--primary); color: #fff; font-weight: 700; font-family: inherit; cursor: pointer; }
  .log-row { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .log-row:last-child { border-bottom: none; }
  .log-actor { font-weight: 800; flex: none; width: 70px; color: var(--text-secondary); }
  .log-actor.ai { color: var(--primary-dark); }
  .log-time { color: var(--text-muted); flex: none; width: 90px; }
  #errorMsg { color: #D64545; text-align: center; font-size: 13.5px; margin: 20px 0; }
</style>
</head>
<body data-no-footer>
<div class="wrap">
  <div id="login-box">
    <h2>🔒 운영 자동화 관리자 로그인</h2>
    <p class="hint" style="margin-top:0;">이 페이지는 role=admin 계정만 들어올 수 있어요.</p>
    <input type="email" id="email" placeholder="관리자 이메일" autocomplete="username">
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password">
    <button id="btnLogin">로그인</button>
  </div>

  <div id="dash" style="display:none;">
    <header class="hub-header" style="text-align:left; padding:0;">
      <div class="top-row">
        <h1 class="hub-title" style="font-size:22px;">📥 승인 대기함</h1>
        <button id="btnLogout" style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-family:inherit;font-size:12.5px;cursor:pointer;">로그아웃</button>
      </div>
    </header>

    <div class="nav-row">
      <a href="admin-automation.html">설정</a>
      <a href="admin-automation-inbox.html" class="current">승인 대기함 · 활동 기록</a>
    </div>

    <details class="new-task-box">
      <summary>➕ 새 작업 등록 (점검 결과를 직접 올리기)</summary>
      <div class="new-task-fields">
        <div class="new-task-row">
          <div>
            <label>영역</label>
            <select id="newArea"></select>
          </div>
          <div>
            <label>등록자</label>
            <select id="newActorType">
              <option value="ai">🤖 AI 점검 결과</option>
              <option value="admin">🙋 관리자 직접 작성</option>
            </select>
          </div>
        </div>
        <div>
          <label>제목</label>
          <input type="text" id="newTitle" maxlength="200" placeholder="예: 신청 폼 제출 실패 오류 발견">
        </div>
        <div>
          <label>내용 (선택)</label>
          <textarea id="newContent" maxlength="2000" placeholder="점검하면서 확인한 내용을 적어주세요"></textarea>
        </div>
        <div>
          <label>관련 링크 (선택)</label>
          <input type="text" id="newLink" placeholder="https://...">
        </div>
        <button id="btnCreateTask">작업 등록</button>
      </div>
    </details>

    <p class="section-title">🕐 대기 중인 작업 (<span id="pendingCount">0</span>)</p>
    <div id="taskList"></div>

    <p class="section-title">📜 최근 활동 기록</p>
    <div id="logList" style="background:#fff;border:1px solid var(--border);border-radius:16px;padding:12px 18px;"></div>
  </div>

  <p id="errorMsg" style="display:none;"></p>
</div>

<script src="js/hub-core.js?v=11"></script>
<script>
const AREAS = ['코드 관리', '보안 업데이트', '사용자 문의', '모니터링', '배포', '데이터 분석', '비용', '정책', '제품 방향'];
document.getElementById('newArea').innerHTML = AREAS.map(a => `<option value="${a}">${a}</option>`).join('');

document.getElementById('btnCreateTask').addEventListener('click', async () => {
  const title = document.getElementById('newTitle').value.trim();
  if (!title) { showError('제목을 입력해주세요.'); return; }
  const btn = document.getElementById('btnCreateTask');
  btn.disabled = true;
  try {
    await Hub.Automation.createTask({
      area: document.getElementById('newArea').value,
      actorType: document.getElementById('newActorType').value,
      title,
      content: document.getElementById('newContent').value.trim(),
      relatedLink: document.getElementById('newLink').value.trim()
    });
    document.getElementById('newTitle').value = '';
    document.getElementById('newContent').value = '';
    document.getElementById('newLink').value = '';
    loadTasks();
    loadLogs();
  } catch (e) {
    showError(e.message);
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('btnLogin').addEventListener('click', doLogin);
document.getElementById('btnLogout').addEventListener('click', () => { Hub.Admin.logout(); location.reload(); });

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('pw').value;
  try {
    await Hub.Admin.login(email, pw, { requireAdmin: true });
    enterDash();
  } catch (e) {
    showError(e.message);
  }
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function enterDash() {
  document.getElementById('login-box').style.display = 'none';
  document.getElementById('dash').style.display = 'block';
  loadTasks();
  loadLogs();
}

async function loadTasks() {
  let tasks;
  try {
    tasks = await Hub.Automation.fetchTasks('pending');
  } catch (e) { showError(e.message); return; }

  document.getElementById('pendingCount').textContent = tasks.length;
  const list = document.getElementById('taskList');
  if (!tasks.length) {
    list.innerHTML = `<p class="empty-note">지금은 대기 중인 작업이 없어요.</p>`;
    return;
  }
  // 영역별로 묶어서 표시
  const byArea = {};
  tasks.forEach(t => { (byArea[t.area] = byArea[t.area] || []).push(t); });

  list.innerHTML = Object.entries(byArea).map(([area, items]) => `
    <p class="task-area" style="margin:14px 0 8px;">${area} (${items.length})</p>
    ${items.map(t => `
      <div class="task-card" data-id="${t.id}">
        <div class="task-top">
          <p class="task-title">${esc(t.title)}</p>
        </div>
        ${t.content ? `<p class="task-content">${esc(t.content)}</p>` : ''}
        <p class="task-meta">${fmtTime(t.created_at)}${t.related_link ? ` · <a class="task-link" href="${esc(t.related_link)}" target="_blank" rel="noopener">관련 링크 →</a>` : ''}</p>
        <div class="task-actions">
          <button class="btn-approve" data-decision="approved">✅ 승인</button>
          <button class="btn-reject" data-decision="rejected">✕ 반려</button>
        </div>
      </div>
    `).join('')}
  `).join('');

  list.querySelectorAll('.task-card').forEach(card => {
    const id = card.getAttribute('data-id');
    card.querySelectorAll('[data-decision]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await Hub.Automation.decideTask(id, btn.getAttribute('data-decision'));
          loadTasks();
          loadLogs();
        } catch (e) {
          showError(e.message);
          btn.disabled = false;
        }
      });
    });
  });
}

async function loadLogs() {
  let logs;
  try {
    logs = await Hub.Automation.fetchLogs(50);
  } catch (e) { showError(e.message); return; }

  const list = document.getElementById('logList');
  if (!logs.length) {
    list.innerHTML = `<p class="empty-note">아직 활동 기록이 없어요.</p>`;
    return;
  }
  list.innerHTML = logs.map(l => `
    <div class="log-row">
      <span class="log-actor ${l.actor_type}">${l.actor_type === 'ai' ? '🤖 AI' : '🙋 관리자'}</span>
      <span class="log-time">${fmtTime(l.created_at)}</span>
      <span>${esc(l.action)}${l.target ? ` · ${esc(l.target)}` : ''}${l.detail ? ` — ${esc(l.detail)}` : ''}</span>
    </div>
  `).join('');
}

function fmtTime(iso) {
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

if (Hub.Admin.getToken() && Hub.Admin.isAdmin()) enterDash();
</script>
</body>
</html>
